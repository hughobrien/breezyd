name: ci
# Merge gate: pure nix build of the flake's checks.gate, checks.module and checks.ui.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  gate:
    runs-on: native
    steps:
      - env:
          # Per-job credential. ~/.netrc sits in a HOME shared by concurrent
          # jobs and raced (403s).
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.${{ github.server_url }}/.extraHeader
          GIT_CONFIG_VALUE_0: "Authorization: Bearer ${{ github.token }}"
        run: |
          umask 077
          src="git+${{ github.server_url }}/${{ github.repository }}.git?ref=${{ github.ref_name }}&rev=${{ github.sha }}"
          nix build --no-write-lock-file -L \
            "$src#checks.x86_64-linux.gate" "$src#checks.x86_64-linux.module" "$src#checks.x86_64-linux.ui"
